<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dungeon Drifters | PYD0</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #171923; color: #f2f4f8; }
    main { width: min(42rem, calc(100% - 2rem)); padding: 2rem; border: 1px solid #41475b; border-radius: 0.5rem; background: #222638; }
    h1 { margin-top: 0; }
    #status { white-space: pre-wrap; line-height: 1.5; }
    .pass { color: #8be0a7; }
    .fail { color: #ff9b9b; }
  </style>
</head>
<body>
  <main>
    <h1>Dungeon Drifters runtime boot</h1>
    <p id="status">Loading pinned Pyodide...</p>
  </main>
  <script src="https://cdn.jsdelivr.net/pyodide/v314.0.7/full/pyodide.js"></script>
  <script src="js/pyd0.js" defer></script>
</body>
</html>
