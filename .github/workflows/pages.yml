name: Browser Pages

on:
  push:
    branches:
      - pyodide
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build browser site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: root
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate authored content
        run: python -m tools.validate_content

      - name: Run Python tests
        run: python -m pytest

      - name: Run web tests
        run: python -m pytest web_tests

      - name: Compile Python sources
        run: python -m compileall src tests web_tests tools

      - name: Check dataclass manifest
        run: python tools/generate_dataclass_manifest.py --check

      - name: Build static browser site
        run: python tools/build_browser_site.py --output site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: root/site

  deploy:
    name: Deploy browser site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
