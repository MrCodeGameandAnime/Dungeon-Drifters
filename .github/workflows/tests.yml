name: Tests

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: root

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate authored content
        run: python -m tools.validate_content

      - name: Run pytest
        run: python -m pytest

      - name: Run web tests
        run: python -m pytest web_tests

      - name: Compile Python sources
        run: python -m compileall src tests web_tests tools

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: root/web_tests/package-lock.json

      - name: Build browser site for smoke test
        run: python tools/build_browser_site.py --output site

      - name: Install browser test dependencies
        working-directory: root/web_tests
        run: npm ci

      - name: Install Chromium
        working-directory: root/web_tests
        run: npx playwright install --with-deps chromium

      - name: Start browser test server
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory site > browser-server.log 2>&1 &
          echo $! > browser-server.pid
          sleep 2

      - name: Run headless browser smoke
        run: node web_tests/browser_smoke.mjs http://127.0.0.1:8765
