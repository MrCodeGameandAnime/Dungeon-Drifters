name: Tests

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: root

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate authored content
        run: python -m tools.validate_content

      - name: Run pytest
        run: python -m pytest

      - name: Run web tests
        run: python -m pytest web_tests

      - name: Compile Python sources
        run: python -m compileall src tests web_tests tools

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: root/web_tests/package-lock.json

      - name: Build browser site for smoke test
        run: python tools/build_browser_site.py --output web/dist

      - name: Install browser test dependencies
        working-directory: root/web_tests
        run: npm ci

      - name: Install Chromium
        working-directory: root/web_tests
        run: npx playwright install --with-deps chromium

      - name: Start browser test server
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory web/dist > browser-server.log 2>&1 &
          echo $! > browser-server.pid
          sleep 2

      - name: Run headless browser smoke
        run: node web_tests/browser_smoke.mjs http://127.0.0.1:8765

  profile-service:
    name: Profile Service (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dd_test
          POSTGRES_PASSWORD: dd_test_ci
          POSTGRES_DB: dd_profile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dd_test -d dd_profile_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: root/services/profile_api

    env:
      PROFILE_API_TEST_DATABASE_URL: postgresql+psycopg://dd_test:dd_test_ci@127.0.0.1:5432/dd_profile_test
      PROFILE_API_MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://dd_test:dd_test_ci@127.0.0.1:5432/dd_profile_migration_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install service and test dependencies
        run: python -m pip install -r requirements.txt -r ../../requirements-dev.txt

      - name: Create a clean migration database
        env:
          PGPASSWORD: dd_test_ci
        run: >-
          psql -h 127.0.0.1 -U dd_test -d postgres -v ON_ERROR_STOP=1
          -c "CREATE DATABASE dd_profile_migration_test;"

      - name: Run service, PostgreSQL, and client/API integration tests
        run: python -m pytest tests

      - name: Compile service and game persistence sources
        run: python -m compileall -q ../../src src tests migrations

      - name: Apply migrations from zero and check model parity
        env:
          DATABASE_URL: postgresql+psycopg://dd_test:dd_test_ci@127.0.0.1:5432/dd_profile_migration_test
        run: |
          python -m alembic upgrade head
          python -m alembic check
